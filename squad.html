<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Squad Management</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a1128;
    color: #fff;
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }

  h1 {
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 4px;
    color: #4fc3f7;
    margin-bottom: 6px;
  }

  .header {
    text-align: center;
    margin-bottom: 16px;
  }

  .header .formation {
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 2px;
  }

  .header .team-name {
    font-size: 11px;
    letter-spacing: 3px;
    color: #8899aa;
    text-transform: uppercase;
    margin-top: 2px;
  }

  .pitch {
    position: relative;
    width: 580px;
    height: 520px;
    background: linear-gradient(180deg, #0d3b1e 0%, #145a2a 50%, #0d3b1e 100%);
    border: 2px solid #1a5c30;
    border-radius: 8px;
    overflow: hidden;
  }

  /* Pitch markings */
  .pitch::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 10%;
    right: 10%;
    height: 1px;
    background: rgba(255,255,255,0.12);
  }

  .pitch::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 80px;
    height: 80px;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }

  .pitch .center-dot {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 6px;
    height: 6px;
    background: rgba(255,255,255,0.15);
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }

  .pitch .box-top {
    position: absolute;
    top: -1px;
    left: 50%;
    transform: translateX(-50%);
    width: 180px;
    height: 60px;
    border: 1px solid rgba(255,255,255,0.12);
    border-top: none;
  }

  .pitch .box-bottom {
    position: absolute;
    bottom: -1px;
    left: 50%;
    transform: translateX(-50%);
    width: 180px;
    height: 60px;
    border: 1px solid rgba(255,255,255,0.12);
    border-bottom: none;
  }

  .player {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    transform: translate(-50%, -50%);
    cursor: pointer;
    transition: transform 0.2s;
  }

  .player:hover {
    transform: translate(-50%, -50%) scale(1.1);
  }

  .jersey {
    width: 40px;
    height: 40px;
    position: relative;
  }

  .jersey svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5));
  }

  .jersey-number {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -45%);
    font-size: 13px;
    font-weight: 900;
    color: #0a1128;
    text-shadow: none;
    pointer-events: none;
  }

  .player-name {
    margin-top: 4px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #fff;
    text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    white-space: nowrap;
  }

  .player-rating {
    font-size: 9px;
    color: #4fc3f7;
    font-weight: 600;
  }

  /* Substitutes */
  .subs-section {
    width: 580px;
    margin-top: 16px;
  }

  .subs-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: #4fc3f7;
    margin-bottom: 10px;
  }

  .subs-row {
    display: flex;
    gap: 8px;
  }

  .sub-card {
    flex: 1;
    background: linear-gradient(135deg, #111d3a 0%, #0e1a30 100%);
    border: 1px solid #1c2e50;
    border-radius: 6px;
    padding: 10px 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
  }

  .sub-card:hover {
    border-color: #4fc3f7;
    background: linear-gradient(135deg, #152544 0%, #111d3a 100%);
  }

  .sub-pos {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #4fc3f7;
    margin-bottom: 4px;
  }

  .sub-name {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    color: #c0cfe0;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }

  .sub-rating {
    font-size: 9px;
    color: #5a7a9a;
    margin-top: 2px;
  }
</style>
</head>
<body>

<div class="header">
  <h1>Squad Management</h1>
  <div class="formation">4 — 3 — 3</div>
  <div class="team-name">FC Stellar · Season 26/27</div>
</div>

<div class="pitch">
  <div class="center-dot"></div>
  <div class="box-top"></div>
  <div class="box-bottom"></div>
</div>

<div class="subs-section">
  <div class="subs-title">Substitutes</div>
  <div class="subs-row" id="subs-row"></div>
</div>

<script>
const jerseySVG = (color) => `
<svg viewBox="0 0 60 58" xmlns="http://www.w3.org/2000/svg">
  <path d="M15 2 L5 14 L12 18 L12 54 L48 54 L48 18 L55 14 L45 2 L38 8 C35 10 25 10 22 8 Z"
    fill="${color}" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
</svg>`;

const players = [
  // GK
  { name: 'Moreira', num: 1, x: 50, y: 92, pos: 'GK', color: '#f4c542' },
  // Defenders
  { name: 'Tanaka', num: 2, x: 15, y: 74, pos: 'RB', color: '#4fc3f7' },
  { name: 'Okafor', num: 4, x: 38, y: 76, pos: 'CB', color: '#4fc3f7' },
  { name: 'Jansen', num: 5, x: 62, y: 76, pos: 'CB', color: '#4fc3f7' },
  { name: 'Dubois', num: 3, x: 85, y: 74, pos: 'LB', color: '#4fc3f7' },
  // Midfielders
  { name: 'Reyes', num: 8, x: 25, y: 52, pos: 'CM', color: '#4fc3f7' },
  { name: 'Andersen', num: 6, x: 50, y: 56, pos: 'CDM', color: '#4fc3f7' },
  { name: 'Kimura', num: 10, x: 75, y: 52, pos: 'CM', color: '#4fc3f7' },
  // Forwards
  { name: 'Fernandes', num: 7, x: 20, y: 28, pos: 'LW', color: '#4fc3f7' },
  { name: 'Nkosi', num: 9, x: 50, y: 22, pos: 'ST', color: '#4fc3f7' },
  { name: 'Volkov', num: 11, x: 80, y: 28, pos: 'RW', color: '#4fc3f7' },
];

const subs = [
  { name: 'Da Silva', pos: 'GK', num: 13 },
  { name: 'Petrov', pos: 'CB', num: 14 },
  { name: 'Mendez', pos: 'CM', num: 16 },
  { name: 'Eriksen', pos: 'CAM', num: 20 },
  { name: 'Obi', pos: 'LW', num: 17 },
  { name: 'Rossi', pos: 'ST', num: 21 },
  { name: 'Nakamura', pos: 'RB', num: 22 },
];

const pitch = document.querySelector('.pitch');

players.forEach(p => {
  const el = document.createElement('div');
  el.className = 'player';
  el.style.left = p.x + '%';
  el.style.top = p.y + '%';
  el.innerHTML = `
    <div class="jersey">
      ${jerseySVG(p.color)}
      <span class="jersey-number">${p.num}</span>
    </div>
    <span class="player-name">${p.name}</span>
  `;
  pitch.appendChild(el);
});

const subsRow = document.getElementById('subs-row');
subs.forEach(s => {
  const card = document.createElement('div');
  card.className = 'sub-card';
  card.innerHTML = `
    <span class="sub-pos">${s.pos}</span>
    <span class="sub-name">${s.name}</span>
  `;
  subsRow.appendChild(card);
});
</script>
</body>
</html>
